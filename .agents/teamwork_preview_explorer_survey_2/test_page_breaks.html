<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: sans-serif; }
  .page {
    width: 210mm;
    height: 297mm;
    page-break-after: always;
    padding: 20mm;
    background: #fff;
  }
</style>
</head>
<body>
  <div class="page" style="background: #eef;"><h1>Page 1</h1></div>
  <div class="page" style="background: #efe;"><h1>Page 2</h1></div>
  <div class="page" style="background: #fee;"><h1>Page 3</h1></div>
  <div class="page" style="background: #ffe;"><h1>Page 4</h1></div>
</body>
</html>
