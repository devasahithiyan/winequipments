{# Controls under the 3D viewer, shared by the chiller and the dryer. Hooks used by chiller360.js: data-c3-rot, data-c3-zoom,
   data-c3-play, data-c3-isolate, data-c3-reset. Pairs that act on the same thing are joined; toggles show on/off with a dark fill. #}
<div class="c3__tools" role="group" aria-label="Viewer controls">
  <div class="c3__grp" role="group" aria-label="Rotate">
    <button type="button" class="c3__tool c3__tool--icon" data-c3-rot="-45" aria-label="Rotate left" title="Rotate left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button type="button" class="c3__tool c3__tool--icon" data-c3-rot="45" aria-label="Rotate right" title="Rotate right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  </div>
  <div class="c3__grp" role="group" aria-label="Zoom">
    <button type="button" class="c3__tool c3__tool--icon" data-c3-zoom="0.12" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/></svg></button>
    <button type="button" class="c3__tool c3__tool--icon" data-c3-zoom="-0.12" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg></button>
  </div>
  <button type="button" class="c3__tool" data-c3-play aria-pressed="false" title="Keep the model turning slowly"><svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>Auto-rotate</span></button>
  <button type="button" class="c3__tool" data-c3-isolate aria-pressed="false" title="Show only the selected part and fade the rest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg><span>Isolate part</span></button>
  <button type="button" class="c3__tool c3__tool--quiet" data-c3-reset title="Back to the starting view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Reset view</span></button>
</div>
