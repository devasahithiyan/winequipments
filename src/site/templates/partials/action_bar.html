<div class="action-bar" id="action-bar">
  <a class="btn btn--primary" href="#quote" data-quote-link>{{ 'Request a document' if document_request | default(false) else 'Request a quote' }}</a>
  <a class="btn btn--secondary btn--icon btn--wa" href="{{ whatsapp('Hello Win Equipments, I need a technical document. Product/model: ' if document_request | default(false) else (wa_text if wa_text is defined else 'Hello Win Equipments, I have an enquiry.')) }}" data-track="whatsapp_click" aria-label="WhatsApp us"><svg aria-hidden="true"><use href="#i-wa"/></svg></a>
  <a class="btn btn--secondary btn--icon" href="tel:{{ site.phones[0].tel }}" data-track="call_click" aria-label="Call {{ site.phones[0].display }}"><svg aria-hidden="true"><use href="#i-phone"/></svg></a>
  <button class="btn btn--secondary btn--icon action-bar__ai" type="button" data-chat-proxy aria-label="Ask our AI assistant"><svg aria-hidden="true"><use href="#i-spark"/></svg></button>
</div>
