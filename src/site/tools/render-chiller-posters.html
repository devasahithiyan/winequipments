<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chiller poster renderer</title>
<link rel="stylesheet" href="/css/site.css">
<script type="importmap">{"imports":{"three":"/js/vendor/three.module.min.js?v=170"}}</script>
<style>
body { padding: 24px; } #stage { width: 480px; height: 600px; position: relative; }
canvas { width: 100%; height: 100%; } button, a { display: inline-block; margin: 12px; padding: 12px; }
</style>
<h1>Generate matching chiller posters</h1>
<p>This renders the current model in its initial pose, without animation or ambient occlusion.</p>
<button id="render">Render both posters</button>
<p id="status" role="status">Ready to render</p>
<div id="stage"></div>
<div id="downloads"></div>
<script type="module">
import { init } from '/js/chiller3d.js';
const stage = document.getElementById('stage');
document.getElementById('render').onclick = async () => {
  document.getElementById('render').disabled = true;
  try {
    for (const lite of [false, true]) {
      const quality = lite ? 'lite' : 'standard';
      document.getElementById('status').textContent = 'Rendering ' + quality;
      const view = await init({ stage, lite, reduce: true, deferAnimation: true, initialView: { ry: 35, rx: -14, zoom: 1 } });
      const { canvas } = view.capture(1200, 1500, null, 0, 0);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      const response = await fetch('/__poster/' + quality, { method: 'POST', headers: { 'Content-Type': 'image/png' }, body: blob });
      if (!response.ok) throw new Error('Could not save ' + quality + ' poster');
      const saved = document.createElement('p');
      saved.textContent = 'Saved chiller-poster-' + quality + '.png';
      document.getElementById('downloads').appendChild(saved);
      view.destroy();
    }
    document.getElementById('status').textContent = 'Both posters rendered';
  } catch (e) { document.getElementById('status').textContent = e.message; }
  document.getElementById('render').disabled = false;
};
</script>
</html>
