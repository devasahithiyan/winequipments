<!-- Save this SVG as 'machine-loader.svg' in your images directory -->
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Outer Gear -->
    <circle cx="50" cy="50" r="30" stroke="#09a43f" stroke-width="4" fill="none">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="2s"
        repeatCount="indefinite" />
    </circle>
    
    <!-- Inner Gear -->
    <circle cx="50" cy="50" r="10" stroke="#09a43f" stroke-width="4" fill="none">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 50 50"
        to="0 50 50"
        dur="1s"
        repeatCount="indefinite" />
    </circle>
    
    <!-- Connecting Rods -->
    <line x1="50" y1="20" x2="50" y2="10" stroke="#09a43f" stroke-width="4">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="2s"
        repeatCount="indefinite" />
    </line>
    <line x1="50" y1="80" x2="50" y2="90" stroke="#09a43f" stroke-width="4">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="2s"
        repeatCount="indefinite" />
    </line>
    <line x1="20" y1="50" x2="10" y2="50" stroke="#09a43f" stroke-width="4">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="2s"
        repeatCount="indefinite" />
    </line>
    <line x1="80" y1="50" x2="90" y2="50" stroke="#09a43f" stroke-width="4">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="2s"
        repeatCount="indefinite" />
    </line>
  </g>
</svg>
